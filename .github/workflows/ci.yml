name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell scripts
        run: bash -n ops/scripts/*.sh
      - name: Verify executable release scripts
        run: test -x ops/scripts/build-release.sh && test -x ops/scripts/deploy-release.sh && test -x ops/scripts/rollback-release.sh
      - name: Verify pinned component references
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD LH-API | awk '{print $2}')" = commit
          test "$(git ls-tree HEAD LH-Agent | awk '{print $2}')" = commit
          test "$(git ls-tree HEAD LH-Panel | awk '{print $2}')" = commit
      - name: Reject committed secrets and release archives
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)\.env$|\.tar\.gz$|\.sha256$|(^|/)id_(rsa|ed25519)$'
